name: book_dashboard
description: "Phil's Library — Android companion app for books (phone + tablet). Same backend, same database as the web dashboard."
publish_to: 'none'
version: 1.0.0+1

environment:
  # Raised from 3.3 with the 2026-08-07 upgrade pass. share_plus 12 only needs
  # Dart >=3.4, but flutter_lints 6 lints (null-aware elements) are used in the
  # source, so 3.10 is the honest floor.
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  # DELIBERATELY HELD AT 10 (2026-08-07). Two separate traps above this line:
  #  - ^12.0.0-beta.x: `pub upgrade --major-versions` resolves to PRERELEASES.
  #  - ^11.0.3: analyzes clean but FAILS THE ANDROID BUILD. The generated
  #    GeneratedPluginRegistrant.java still registers
  #    com.mr.flutter.plugin.filepicker.FilePickerPlugin, which no longer
  #    resolves -> "cannot find symbol" in :app:compileReleaseJavaWithJavac.
  #    `flutter analyze` cannot catch this; only an APK build does.
  # 10.x gives this app everything it uses (pickFiles), so the bump bought
  # nothing. Revisit only with a real APK build, not an analyze.
  file_picker: ^10.3.10
  webview_flutter: ^4.8.0
  path_provider: ^2.1.3
  # 12, NOT 13 (unlike the other two apps): share_plus 13 needs win32 ^6, while
  # file_picker <12 needs win32 ^5, and pub cannot satisfy both. 12.0.2 already
  # has the SharePlus.instance.share(ShareParams(...)) API, so the share code is
  # identical across all three apps — only the constraint differs. Revisit when
  # file_picker 12 leaves beta and moves to win32 ^6.
  share_plus: ^12.0.2
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
